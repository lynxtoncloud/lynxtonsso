name: lynxtonsso

services:
  postgres:
    image: postgres:17.6-alpine
    mem_limit: 256m
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${SSO_DB_PASSWORD:?Run python3 branding/docker/start.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: lynxtonsso:v1.0.0
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        KEYCLOAK_BASE_IMAGE: ${KEYCLOAK_BASE_IMAGE:-quay.io/keycloak/keycloak:26.3.2}
    mem_limit: 1g
    command:
      - start-dev
      - --import-realm
      - --spi-theme--static-max-age=-1
      - --spi-theme--cache-themes=false
      - --spi-theme--cache-templates=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${SSO_DB_PASSWORD:?Run python3 branding/docker/start.py first}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SSO_ADMIN_PASSWORD:?Run python3 branding/docker/start.py first}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_HOST: 0.0.0.0
      KC_HOSTNAME: http://localhost:${SSO_PORT:-58080}
      LYNXTON_TEST_PASSWORD: ${SSO_TEST_PASSWORD:?Run python3 branding/docker/start.py first}
    ports:
      - "127.0.0.1:${SSO_PORT:-58080}:8080"
    volumes:
      - type: bind
        source: ./.local/import
        target: /opt/keycloak/data/import
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 36

volumes:
  postgres-data:
